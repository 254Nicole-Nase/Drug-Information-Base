# Nitro generates the real Worker config (entry + assets) into the build output
# and points wrangler at it via .wrangler/deploy/config.json, so this file only
# carries the project name, compatibility settings and plain vars.
name = "drug-info-center"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

